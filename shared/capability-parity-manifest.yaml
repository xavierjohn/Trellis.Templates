# Trellis Template Capability-Parity Manifest
# Single source of truth for the cross-cutting capabilities every Trellis template MUST implement.
# CI instantiates each template (dotnet new), builds it, optionally boots it, and asserts each
# required capability's checks. A missing/failed capability fails the build — drift is caught by CI,
# not by human discipline. The human-readable parity matrix is GENERATED from this file.

templates:
  asp:
    new: trellis-asp
    boot: { project: Api, urlPath: "/openapi/2026-03-26.json" }   # placeholder boot target
  microservices:
    new: trellis-microservices
    boot: { project: Members, port: 5003 }

# check kinds:
#   source-contains  - regex must match in the instantiated tree (glob scopes files; anyOf = OR)
#   http-status      - boot the project, issue request, assert status   ({version} expands per template)
#   package-referenced - a PackageReference exists
#   builds           - the instantiated solution builds (global)
#   docs-in-sync     - AgentDocs-managed package guidance matches the restored graph (global)

capabilities:

  api-versioning:
    title: Date-based API versioning
    requiredFor: [asp, microservices]
    docs: conventions/api-versioning.md
    checks:
      - { kind: source-contains, glob: "**/*.cs", pattern: "AddApiVersioning" }
      - kind: source-contains   # endpoints/controllers are version-bound
        anyOf:
          - { glob: "**/*Endpoints.cs", pattern: "MapToApiVersion" }            # minimal API
          - { glob: "**/Controllers/**/*.cs", pattern: "v20\\d{2}_\\d{2}_\\d{2}" } # versioned namespace (MVC)
      - { kind: http-status, request: "GET {version}", expect: 200, desc: "per-version OpenAPI doc serves" }

  sli:
    title: Service Level Indicators
    requiredFor: [asp, microservices]
    docs: conventions/sli.md
    checks:
      - { kind: source-contains, glob: "**/*.cs", pattern: "AddServiceLevelIndicator" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "UseServiceLevelIndicator" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "AddServiceLevelIndicatorInstrumentation" }

  idempotency:
    title: Idempotent writes
    requiredFor: [asp, microservices]
    docs: conventions/idempotency.md
    checks:
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "AddTrellisIdempotency|\\.UseIdempotency\\(" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "UseTrellisIdempotency" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "IdempotentAttribute|\\[Idempotent\\]" }
      - { kind: package-referenced, package: "Trellis.Asp.Idempotency.Cosmos" }
      - { kind: source-contains, glob: "**/src/IdempotencyRegistration.cs", pattern: "AddCosmosIdempotencyStore" }
      - { kind: source-contains, glob: "**/src/IdempotencyRegistration.cs", pattern: "(?s)if \\(!environment.IsDevelopment\\(\\)\\)\\s+throw new InvalidOperationException", desc: "in-memory storage fails closed outside Development" }
      - { kind: source-contains, glob: "infra/idempotency.bicep", pattern: "'/scope'", desc: "Cosmos partition key matches the store contract" }
      - { kind: source-contains, glob: "infra/idempotency.bicep", pattern: "defaultTtl:\\s*-1\\b", desc: "per-item TTL is enabled without expiring reservations" }
      - { kind: source-contains, glob: "infra/idempotency.bicep", pattern: "disableLocalAuth:\\s*true", desc: "Cosmos uses managed identity rather than account keys" }
      - { kind: source-contains, glob: "infra/idempotency-access.bicep", pattern: "00000000-0000-0000-0000-000000000002", desc: "native Cosmos data contributor role" }
      - { kind: source-contains, glob: "infra/idempotency-access.bicep", pattern: "scope:.*?/dbs/.*?/colls/", desc: "role assignment is scoped to the idempotency container" }

  problem-details:
    title: RFC 9457 ProblemDetails
    requiredFor: [asp, microservices]
    docs: conventions/problem-details.md
    checks:
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "AddTrellisProblemDetails|\\.UseProblemDetails\\(" }
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "UseTrellisProblemDetails" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "CustomizeProblemDetails" }

  scalar-validation:
    title: Scalar value-object validation (422 on bad VO bind)
    requiredFor: [asp, microservices]
    docs: conventions/scalar-validation.md
    checks:
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "AddTrellisAspWithScalarValidation|AddScalarValueValidation|(?s)AddTrellis\\([^;]+\\.UseScalarValueValidation\\(" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "UseScalarValueValidation" }

  openapi-scalar:
    title: OpenAPI document + Scalar UI
    requiredFor: [asp, microservices]
    docs: conventions/openapi.md
    checks:
      - { kind: source-contains, glob: "**/*.cs", pattern: "AddOpenApi" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "MapScalarApiReference" }
      - { kind: http-status, request: "GET {version}", expect: 200 }

  observability:
    title: OpenTelemetry + exported mediator spans + business-event logging
    requiredFor: [asp, microservices]
    docs: conventions/observability.md
    checks:
      - { kind: source-contains, glob: "**/*.cs", pattern: "AddOpenTelemetry" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "WithTracing" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "[Ll]ogging\\.AddOpenTelemetry" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "AddTrellisMediatorInstrumentation|AddSource\\(\"Trellis.Mediator\"\\)", desc: "mediator spans actually exported" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "LoggerMessage", desc: "handlers emit structured business events" }
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "OTEL_EXPORTER_OTLP_ENDPOINT", desc: "OTLP requires an explicitly configured destination" }
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "APPLICATIONINSIGHTS_CONNECTION_STRING", desc: "Azure Monitor is configuration-aware" }
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "UseAzureMonitor" }
      - { kind: source-contains, glob: "infra/**/*.bicep", pattern: "Microsoft.Insights/components", desc: "Azure deployment provisions application telemetry" }
      - { kind: source-contains, glob: "infra/**/*.bicep", pattern: "WorkspaceResourceId", desc: "Application Insights is workspace-based" }

  composition-root:
    title: Current Trellis composition APIs
    requiredFor: [asp, microservices]
    checks:
      - { kind: package-referenced, package: "Trellis.ServiceDefaults" }
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "(?s)AddTrellis\\([^;]+\\.UseAsp\\(" }
      - { kind: source-contains, glob: "**/Api/src/**/*.cs", pattern: "\\.UseResourceAuthorization\\(", desc: "resource authorization belongs to the API composition" }
      - { kind: source-contains, glob: "**/Api/src/**/*.cs", pattern: "\\.UseEntityFrameworkUnitOfWork<", desc: "unit-of-work ordering is selected by the composition builder" }

  authorization:
    title: Actor-based authorization
    requiredFor: [asp, microservices]
    docs: conventions/authorization.md
    checks:
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "AddResourceAuthorization|\\.UseResourceAuthorization\\(" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "IAuthorize|RequiredPermissions" }

  conditional-writes:
    title: Required overwrite preconditions and optional transition preconditions
    requiredFor: [asp, microservices]
    checks:
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "ETagHelper\\.ParseIfMatch\\(", desc: "HTTP boundary parses preconditions" }
      - { kind: source-contains, glob: "**/*Command.cs", pattern: "EntityTagValue\\[\\]\\? IfMatchETags", desc: "commands carry parsed preconditions" }
      - { kind: source-contains, glob: "**/*Command.cs", pattern: "\\.RequireETag(?:Async)?\\(command\\.IfMatchETags\\)", desc: "overwrites enforce required preconditions" }
      - { kind: source-contains, glob: "AGENTS.md", pattern: "MUST honor a supplied `If-Match`", desc: "optional does not mean ignored" }
      - { kind: source-contains, glob: "AGENTS.md", pattern: "\\.OptionalETag(?:Async)?\\(command\\.IfMatchETags\\)", desc: "guarded transitions enforce supplied preconditions before mutation" }

  mediator-pipeline:
    title: Trellis mediator pipeline
    requiredFor: [asp, microservices]
    docs: conventions/mediator.md
    checks:
      - { kind: source-contains, glob: "**/*.cs", pattern: "AddMediator" }
      - { kind: source-contains, glob: "**/src/**/*.cs", pattern: "AddTrellisBehaviors|\\.UseMediator\\(" }

  health-checks:
    title: Health endpoints
    requiredFor: [asp, microservices]
    docs: conventions/health.md
    checks:
      - { kind: source-contains, glob: "**/*.cs", pattern: "MapHealthChecks|MapDefaultEndpoints" }
      - { kind: http-status, request: "GET /health", expect: 200, env: Development }

  resource-naming:
    title: Convention-based Azure resource naming
    requiredFor: [asp, microservices]
    docs: conventions/resource-naming.md
    checks:
      - { kind: package-referenced, package: "Trellis.ResourceNaming.Azure" }
      - { kind: source-contains, glob: "**/*.cs", pattern: "DeployedEnvironmentOptions|IResourceNamer" }

  build-guidance:
    title: Agent-neutral build guidance and Trellis references
    requiredFor: [asp, microservices]
    docs: conventions/build-guidance.md
    checks:
      - { kind: source-contains, glob: "AGENTS.md", pattern: "command and its handler", desc: "canonical agent guide documents command + handler colocation" }
      - { kind: source-contains, glob: "AGENTS.md", pattern: "[Pp]ermission", desc: "canonical agent guide documents permissions-in-Domain" }
      - { kind: source-contains, glob: "AGENTS.md", pattern: "TRLS066", desc: "canonical agent guide documents nullable-field conversion" }
      - { kind: source-contains, glob: ".github/copilot-instructions.md", pattern: "\\.\\./AGENTS\\.md", desc: "Copilot delegates to the canonical agent guide" }
      - { kind: source-contains, glob: "**/.config/dotnet-tools.json", pattern: "\"trellis.agentdocs\"", desc: "local AgentDocs tool is pinned" }
      - { kind: source-contains, glob: "**/.agentdocs/policy.json", pattern: "\"Trellis.Core\"", desc: "framework guidance publisher is approved" }
      - { kind: source-contains, glob: "**/.agentdocs/README.md", pattern: "Required reading by project", desc: "project-aware guidance index is shipped" }
      - { kind: source-contains, glob: "**/.agentdocs/packages/trellis.core/trellis/trellis-start-here.md", pattern: "Trellis.*start here", desc: "framework router is installed in the canonical AgentDocs package location" }
      - { kind: source-contains, glob: "**/.agentdocs/agent-context.json", pattern: "\"Graph\"", desc: "managed context records the restored graph" }
      - { kind: source-contains, glob: "AGENTS.md", pattern: "(?s)<!-- agentdocs:start -->.*\\.agentdocs/README\\.md.*<!-- agentdocs:end -->", desc: "canonical agent guide has a managed index pointer" }
      - { kind: source-contains, glob: ".github/copilot-instructions.md", pattern: "(?s)<!-- agentdocs:start -->.*\\.agentdocs/README\\.md.*<!-- agentdocs:end -->", desc: "Copilot has a managed index pointer" }

  # --- template-specific (still tracked, but not cross-cutting) -------------------------------
  guarded-todo-completion:
    title: Optional completion preconditions
    requiredFor: [asp]
    checks:
      - { kind: source-contains, glob: "Application/src/Todos/CompleteTodoCommand.cs", pattern: "(?s)\\.ToResultAsync\\(.*\\.OptionalETagAsync\\(command\\.IfMatchETags\\).*\\.CheckAsync\\(todo => todo\\.Complete", desc: "precondition runs before completion" }
      - { kind: source-contains, glob: "Api/src/2026-03-26/Controllers/TodosController.cs", pattern: "CompleteTodoCommand\\.TryCreate\\(id, ETagHelper\\.ParseIfMatch\\(Request\\)\\)", desc: "first API version forwards the header" }
      - { kind: source-contains, glob: "Api/src/2026-12-01/Controllers/TodosController.cs", pattern: "CompleteTodoCommand\\.TryCreate\\(id, ETagHelper\\.ParseIfMatch\\(Request\\)\\)", desc: "second API version forwards the header" }

  servicebus-transport:
    title: Shipped Trellis Service Bus transport
    requiredFor: [microservices]
    checks:
      - { kind: package-referenced, package: "Trellis.Messaging.AzureServiceBus" }
      - { kind: source-contains, glob: "Members/Acl/src/DependencyInjection.cs", pattern: "AddAzureServiceBusIntegrationEventPublisher" }
      - { kind: source-contains, glob: "Projects/Acl/src/DependencyInjection.cs", pattern: "AddAzureServiceBusIntegrationEventConsumer" }
      - { kind: source-contains, glob: "SharedKernel/src/*.cs", pattern: "\\[IntegrationEventName\\(" }
      - { kind: source-contains, glob: "AppHost/src/Program.cs", pattern: "AddServiceBusTopic" }
      - { kind: source-contains, glob: "AppHost/src/Program.cs", pattern: "AddServiceBusSubscription" }
      - { kind: source-contains, glob: "AppHost/src/Program.cs", pattern: "CorrelationFilter", desc: "the emulator subscription has an explicit delivery rule" }
      - { kind: source-contains, glob: "Members/Api/src/Program.cs", pattern: "\\.UseOutbox<" }
      - { kind: source-contains, glob: "Projects/Api/src/Program.cs", pattern: "\\.UseInbox<" }

  microservices-guidance:
    title: AgentDocs-managed microservices references
    requiredFor: [microservices]
    checks:
      - { kind: source-contains, glob: "**/.agentdocs/policy.json", pattern: "\"Trellis.Microservices.Abstractions\"" }
      - { kind: source-contains, glob: "**/.agentdocs/policy.json", pattern: "\"Trellis.Microservices.AspNetCore\"" }
      - { kind: source-contains, glob: "**/.agentdocs/policy.json", pattern: "\"Trellis.Yarp\"" }
      - { kind: source-contains, glob: "**/.agentdocs/packages/trellis.microservices.abstractions/trellis-api-microservices-abstractions.md", pattern: "Trellis" }
      - { kind: source-contains, glob: "**/.agentdocs/packages/trellis.microservices.abstractions/trellis-api-microservices-cookbook.md", pattern: "Trellis" }
      - { kind: source-contains, glob: "**/.agentdocs/packages/trellis.microservices.aspnetcore/trellis-api-internal-jwt.md", pattern: "Trellis" }
      - { kind: source-contains, glob: "**/.agentdocs/packages/trellis.yarp/trellis-api-yarp.md", pattern: "Trellis" }

  aspire-servicedefaults:
    title: Aspire AppHost + ServiceDefaults
    requiredFor: [microservices]
    docs: conventions/aspire.md
    checks:
      - { kind: source-contains, glob: "**/*.cs", pattern: "AddServiceDefaults" }
      - { kind: source-contains, glob: "**/*.csproj", pattern: "Aspire" }

  efcore-conventions:
    title: Trellis EF Core conventions
    requiredFor: [asp]
    docs: conventions/efcore.md
    checks:
      - { kind: source-contains, glob: "**/*.cs", pattern: "ApplyTrellisConventionsFor|AddTrellisInterceptors" }

global-checks:
  - { kind: builds, config: Release, expect: { warnings: 0, errors: 0 } }
  - { kind: docs-in-sync, command: "dotnet tool run agentdocs check --strict" }
