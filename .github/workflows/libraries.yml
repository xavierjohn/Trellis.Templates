# Builds and tests the resource-naming libraries (src/) on every change that touches them.
name: Libraries

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'build/**', 'docs/api_reference/**', '.github/workflows/libraries.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'src/**', 'build/**', 'docs/api_reference/**', '.github/workflows/libraries.yml' ]

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Trellis.ResourceNaming.slnx

      - name: Build
        run: dotnet build src/Trellis.ResourceNaming.slnx --no-restore -c Release

      - name: Test
        run: dotnet test src/Trellis.ResourceNaming.slnx --no-build -c Release

      # Packaging is the only place the API-reference delivery wiring is observable. A broken
      # payload path or a suppressed Build asset leaves the build and the tests entirely green
      # while shipping no documentation at all, so this gate packs and inspects the .nupkg.
      - name: Verify API reference packaging
        shell: pwsh
        run: ./build/test-apireference-packaging.ps1 -Configuration Release
