# Capability-parity gate.
#
# For each template profile, runs the shared contract against generated output and fails the
# build if any required capability is missing or regressed. This is the guardrail that keeps the
# two templates from silently drifting apart. It instantiates each profile and asserts the
# selected capability is present and unselected optional features are absent.
#
# Adding a template to the contract = adding its folder name to the matrix below.
name: Capability parity

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  contract:
    name: contract (${{ matrix.template }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [ asp, microservices ]
        profile: [ default, versioned-postgres, azure-sqlserver, azure-postgres ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate profile and run capability-parity contract
        shell: pwsh
        run: |
          $hive = Join-Path '${{ runner.temp }}' 'template-hive'
          $output = Join-Path '${{ runner.temp }}' 'generated'
          dotnet new install '${{ github.workspace }}/${{ matrix.template }}/template' --debug:custom-hive $hive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $options = switch ('${{ matrix.profile }}') {
            'versioned-postgres' { '--api-versioning', '--database', 'postgres', '--auth', 'entra', '--telemetry-exporters', 'both', '--deployment', 'container' }
            'azure-sqlserver' { '--database', 'sqlserver', '--deployment', 'azure', '--telemetry-exporters', 'azure-monitor' }
            'azure-postgres' { '--database', 'postgres', '--deployment', 'azure', '--auth', 'entra', '--telemetry-exporters', 'both' }
            default { @() }
          }
          $short = if ('${{ matrix.template }}' -eq 'asp') { 'trellis-asp' } else { 'trellis-microservices' }
          dotnet new $short --debug:custom-hive $hive -n ProfileService -o $output --skip-restore @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project shared/contract-tests/runner.csproj -c Release -- `
            shared/capability-parity-manifest.yaml '${{ matrix.template }}' $output
          exit $LASTEXITCODE

      - name: Compile Azure infrastructure
        if: ${{ startsWith(matrix.profile, 'azure-') }}
        run: |
          az bicep install
          for file in "${{ runner.temp }}"/generated/infra/*.bicep; do
            az bicep build --file "$file" --outfile "${{ runner.temp }}/$(basename "$file" .bicep).json"
          done

      - name: Verify managed AgentDocs
        if: ${{ matrix.profile == 'default' }}
        run: |
          SOURCE="${{ runner.temp }}/agentdocs-${{ matrix.template }}"
          mkdir -p "$SOURCE"
          cp -a "${{ matrix.template }}/template/." "$SOURCE/"
          cd "$SOURCE"
          git init --quiet
          dotnet tool restore
          dotnet restore
          dotnet tool run agentdocs check --strict --strict-references --content-only

  required-contract:
    name: contract (${{ matrix.template }})
    needs: contract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [ asp, microservices ]
    steps:
      - name: Require all parity profiles to succeed
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
        run: |
          if [ "$CONTRACT_RESULT" != "success" ]; then
            echo "::error::Capability-parity matrix finished with '$CONTRACT_RESULT'; all profiles must succeed."
            exit 1
          fi
